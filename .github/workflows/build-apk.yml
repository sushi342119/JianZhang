name: Build & Release Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore Release Signing Keystore from Secret (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/jianzhang-release.jks
          fi

      - name: Install dependencies, test & build web bundle
        run: |
          npm ci
          npx vitest run
          npm run build
          npx cap sync android

      - name: Build Signed Release or Debug APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if [ -f "app/jianzhang-release.jks" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JianZhang-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Signed APK to GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp android/app/build/outputs/apk/release/app-release.apk "JianZhang-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "JianZhang-${TAG}.apk#简账-${TAG}-安卓正式版.apk" --clobber
          else
            gh release create "$TAG" "JianZhang-${TAG}.apk#简账-${TAG}-安卓正式版.apk" --title "简账 ${TAG} · 安卓正式版" --generate-notes
          fi
