<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Calm Pine-Jade Gradient Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgC)"/>
  <!-- Three-in-One Minimalist Petals / Cards Forming Central Sparkle -->
  <!-- Top-Left: Work Time Circle/Tile -->
  <rect x="140" y="140" width="104" height="104" rx="32" fill="#FFFFFF"/>
  <!-- Top-Right: Subscription Card Tile -->
  <rect x="268" y="140" width="104" height="104" rx="32" fill="#FFFFFF" opacity="0.82"/>
  <!-- Bottom Wide: Unified Ledger Base -->
  <rect x="140" y="268" width="232" height="104" rx="34" fill="#FFFFFF"/>
  <!-- Subtle Balance Pill inside Ledger Base -->
  <line x1="184" y1="320" x2="276" y2="320" stroke="#047857" stroke-width="16" stroke-linecap="round"/>
  <circle cx="324" cy="320" r="10" fill="#10B981"/>
</svg>
